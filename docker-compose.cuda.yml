# NVIDIA override: docker compose -f docker-compose.yml -f docker-compose.cuda.yml up --build
# Requires the NVIDIA Container Toolkit (or Docker Desktop with WSL2 GPU support).
services:
  llama:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    command: ["-m", "/models/${MODEL_FILE:-qwen2.5-0.5b-instruct-q4_k_m.gguf}",
              "--host", "0.0.0.0", "--port", "8081", "-t", "${LLAMA_THREADS:-4}",
              "-c", "${CTX:-8192}", "--parallel", "4", "--metrics", "--no-webui", "-ngl", "99"]
    deploy:
      resources:
        reservations:
          devices: [{ driver: nvidia, count: 1, capabilities: [gpu] }]
